name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas, tipos y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  datos:
    name: Datos sincronizados y citas verificadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Falla si una cita no aparece en su página del informe o si src/content no coincide con data/.
      - run: python3 -I scripts/export.py
      - run: git diff --exit-code -- src/content

  adaptable:
    name: Móvil y tableta (6 tamaños, axe)
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Servir la web
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
      - run: node scripts/responsive-qa.mjs http://127.0.0.1:4321 qa
      - name: Sin hallazgos
        run: |
          node -e "const r = require('./qa/report.json'); console.log(JSON.stringify(r.byKind)); if (r.report.length || r.errors.length) process.exit(1);"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-adaptable
          path: qa
